<style>
/* Layout: one-column phone app shell, sticky header with role switch; mushaf opens as a full-screen reading sheet */
:root{
  --bg:#eef2f4; --surface:#ffffff; --ink:#13222c; --muted:#5a6a74; --line:#d9e1e5;
  --lapis:#1c4f7c; --lapis-ink:#ffffff; --lapis-soft:#e2ecf5;
  --gold:#a07c26; --gold-soft:#f5ecd6;
  --ok:#2b774b; --ok-soft:#e0f0e6; --warn:#a85d18; --warn-soft:#f7eadb;
  --page:#fffdf7; --page-edge:#e8dfc6; --shade:rgba(19,34,44,.45);
  --f-quran:"Amiri Quran","Amiri","Traditional Arabic",serif;
  --f-brand:"Aref Ruqaa","Amiri",serif;
  --f-ui:"Readex Pro","Segoe UI","Tahoma",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1418; --surface:#162027; --ink:#e4eaee; --muted:#93a3ad; --line:#26333b;
  --lapis:#78aedd; --lapis-ink:#0b1a26; --lapis-soft:#1a2d3e;
  --gold:#d6b462; --gold-soft:#2e2715;
  --ok:#6cc392; --ok-soft:#15301f; --warn:#e2a064; --warn-soft:#33251a;
  --page:#141c21; --page-edge:#2e3a33; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1418; --surface:#162027; --ink:#e4eaee; --muted:#93a3ad; --line:#26333b;
  --lapis:#78aedd; --lapis-ink:#0b1a26; --lapis-soft:#1a2d3e;
  --gold:#d6b462; --gold-soft:#2e2715;
  --ok:#6cc392; --ok-soft:#15301f; --warn:#e2a064; --warn-soft:#33251a;
  --page:#141c21; --page-edge:#2e3a33; --shade:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lapis);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-brand);font-size:26px;line-height:1;color:var(--lapis);margin-inline-end:auto}
.brand small{display:block;font-family:var(--f-ui);font-size:11px;color:var(--muted);font-weight:400;margin-top:4px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--lapis);color:var(--lapis-ink);font-weight:500}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.demo{font-size:12px;color:var(--muted);background:var(--gold-soft);border-radius:10px;padding:8px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.demo button{border:0;background:none;color:var(--gold);text-decoration:underline;font-size:12px;padding:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.h{font-size:13px;color:var(--muted);letter-spacing:.02em;margin:0 0 8px;font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2{font-size:18px;margin:0;font-weight:600;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}

/* wird hero */
.wird{background:var(--lapis);color:var(--lapis-ink);border:0;position:relative;overflow:hidden}
.wird .h{color:inherit;opacity:.8}
.wird .range{font-family:var(--f-quran);font-size:24px;line-height:1.7;margin:4px 0 2px}
.wird .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;opacity:.9}
.wird::after{content:"۞";position:absolute;inset-inline-start:-14px;bottom:-40px;font-size:140px;opacity:.08;font-family:var(--f-quran);pointer-events:none}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:500;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-light{background:var(--lapis-ink);color:var(--lapis)}
.btn-main{background:var(--lapis);color:var(--lapis-ink)}
.btn-ghost{background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.btn-ok{background:var(--ok);color:var(--surface)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row .btn{flex:1 1 auto}

.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.wird .bar{background:rgba(255,255,255,.2)} .wird .bar i{background:var(--lapis-ink)}

/* member list */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--lapis-soft);color:var(--lapis);font-weight:600;flex:none}
.grow{flex:1;min-width:0}
.name{font-weight:500}
.chip{font-size:12px;border-radius:99px;padding:3px 10px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.wait{background:var(--warn-soft);color:var(--warn)}
.pts{font-size:13px;color:var(--gold);font-weight:600;white-space:nowrap}

/* composer */
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field>label,.field>.lbl{font-size:13px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opts button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 4px;font-size:13px;line-height:1.3}
.opts button small{display:block;color:var(--muted);font-size:11px}
.opts button[aria-pressed="true"]{border-color:var(--lapis);background:var(--lapis-soft);color:var(--lapis);font-weight:500}
.opts button[aria-pressed="true"] small{color:var(--lapis)}
select,input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.radio{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.radio input{margin-top:5px;accent-color:var(--lapis)}
.preview{margin-top:14px;border:1px dashed var(--gold);background:var(--gold-soft);border-radius:12px;padding:12px 14px}
.preview .q{font-family:var(--f-quran);font-size:20px;line-height:1.8}
.preview .sub b{color:var(--ink);font-weight:500}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat{background:var(--bg);border-radius:12px;padding:10px 4px}
.stat b{display:block;font-size:22px;font-weight:600}
.stat span{font-size:12px;color:var(--muted)}

.note{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.note:first-child{border-top:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--lapis);margin-top:8px;flex:none}
.note.read .dot{background:transparent}
.note time{display:block;font-size:12px;color:var(--muted)}
.bell{position:relative;border:1px solid var(--line);background:var(--bg);border-radius:50%;width:38px;height:38px;display:grid;place-items:center}
.badge{position:absolute;top:-4px;inset-inline-end:-4px;background:var(--warn);color:var(--surface);font-size:11px;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who select{width:auto;padding:6px 10px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:.12em;direction:ltr}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.switch input{width:20px;height:20px;accent-color:var(--lapis)}
.empty{color:var(--muted);font-size:14px;padding:8px 0}

/* reader */
.reader{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.r-head,.r-foot{background:var(--surface);border-color:var(--line);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.r-head{border-bottom:1px solid var(--line);padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px}
.r-foot{border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
.r-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px}
.r-title{flex:1;min-width:0;font-size:13px}
.r-title b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{border:0;background:var(--bg);border-radius:50%;width:36px;height:36px;font-size:18px}
.r-body{flex:1;overflow-y:auto;padding:16px max(12px,env(safe-area-inset-left,0px)) 24px max(12px,env(safe-area-inset-right,0px))}
.mushaf{max-width:620px;margin:0 auto;background:var(--page);border:1px solid var(--page-edge);border-radius:6px;padding:18px 18px 12px;
  box-shadow:0 0 0 5px var(--page),0 0 0 6px var(--page-edge)}
.mushaf .txt{font-family:var(--f-quran);font-size:24px;line-height:2.25;text-align:justify;text-align-last:center}
.ay.out{opacity:.28}
.an{color:var(--gold);font-size:.85em;white-space:nowrap}
.rub{color:var(--gold);margin-inline-end:4px}
.sura{display:block;text-align:center;margin:10px 0 4px;border:1px solid var(--gold);border-radius:4px;padding:2px 8px;
  font-family:var(--f-quran);font-size:21px;color:var(--gold);background:var(--gold-soft)}
.basm{display:block;text-align:center}
.pg{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
.mark{display:block;text-align:center;font-family:var(--f-ui);font-size:12px;color:var(--lapis);background:var(--lapis-soft);border-radius:99px;margin:6px auto;padding:2px 12px;width:fit-content;line-height:1.8}

.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:50%;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2);transition:opacity .25s}
.modal{position:fixed;inset:0;z-index:30;background:var(--shade);display:grid;place-items:center;padding:20px}
.dlg{background:var(--surface);border-radius:20px;padding:24px 20px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px}
.dlg .big{font-family:var(--f-brand);font-size:30px;color:var(--lapis);line-height:1.3}
.dlg .q{font-family:var(--f-quran);font-size:19px;line-height:1.9;color:var(--gold)}
/* header user + auth */
.hdr{display:flex;align-items:center;gap:10px}
.userchip{display:flex;flex-direction:column;line-height:1.25;text-align:start;font-size:14px}
.userchip .sub{font-size:11px}
.btn.out{padding:6px 12px;font-size:13px;border-radius:999px}
.hero{text-align:center;padding:18px 8px 6px}
.logo{font-family:var(--f-brand);font-size:64px;line-height:1.1;color:var(--lapis)}
.hero .sub{max-width:34ch;margin:8px auto 0;font-size:14px}
.rolecard{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.rolecard:hover{border-color:var(--lapis)}
.rolecard b{display:block;font-size:17px;font-weight:600}
.rolecard .sub{font-size:13px}
.ri{width:46px;height:46px;border-radius:12px;background:var(--lapis-soft);color:var(--lapis);display:grid;place-items:center;font-size:24px;flex:none;font-family:var(--f-quran)}
.go{color:var(--muted);font-size:22px}
.hint .code{font-size:13px;letter-spacing:0;color:var(--ink)}
.back{border:0;background:none;color:var(--lapis);padding:0;font-size:14px;align-self:flex-start}
.auth h2{margin-bottom:12px}
.tabs{display:flex;width:100%}
.tabs button{flex:1}
input[type=password]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus{border-color:var(--lapis);outline:none;box-shadow:0 0 0 3px var(--lapis-soft)}
.info{color:var(--ok);background:var(--ok-soft);border-radius:10px;padding:8px 12px;margin:14px 0 0;font-size:14px}
.err{color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:8px 12px;margin:14px 0 0;font-size:14px}

/* standalone page base */
html{-webkit-text-size-adjust:100%;color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100vh;min-height:100dvh}
[hidden]{display:none!important} img{max-width:100%}
input,select{font-size:16px}
.pw{position:relative}
.pw input{padding-left:72px}
.eye{position:absolute;left:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--lapis);font-size:13px;padding:8px 10px;border-radius:8px}
.otp{font-size:26px!important;letter-spacing:.35em;text-align:center;padding:12px!important;font-variant-numeric:tabular-nums}
.back[disabled]{color:var(--muted);text-decoration:none;cursor:default}
@media (max-width:480px){
  body{font-size:16px}
  .brand{font-size:24px}
  .card{padding:16px 14px}
  .btn{padding:14px 18px;font-size:16px}
  .rolecard{padding:18px 16px}
  .wird .range{font-size:22px}
  .opts button{padding:10px 2px;font-size:14px}
}
@media (min-width:900px){
  .wrap{max-width:640px}
  .top-in{max-width:640px}
  main{padding-block:28px 56px}
}
.themebtn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;height:36px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.themebtn b{font-size:16px;font-weight:400;line-height:1}
@media (max-width:480px){.themebtn span{display:none}.themebtn{width:36px;padding:0;justify-content:center}}
.row .btn.sm{flex:0 0 auto;padding:8px 14px;font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.appcard .grow{font-size:14px;min-width:0}
.mseg button{padding:5px 10px;font-size:12px}
.mushaf.md{padding:14px 10px 10px;max-width:min(620px,calc((100dvh - 190px) * 0.64))}
.m4{direction:rtl;color:var(--ink);line-height:1.9;user-select:none;-webkit-user-select:none;overflow:hidden}
.l4{display:flex;white-space:nowrap;align-items:baseline}
.l4.just{justify-content:space-between}
.l4.cen{justify-content:center}
.l4 span{display:inline-block}
.l4 .out,.l4.out{opacity:.28}
.l4.hd{color:var(--gold);margin:2px 0}
.gbar{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.gsel{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 220px}
.gsel select{flex:1;min-width:0;padding:8px 10px;font-weight:500}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 0;font-size:14px}
.days button[aria-pressed="true"]{border-color:var(--lapis);background:var(--lapis-soft);color:var(--lapis);font-weight:600}
input[type=time]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--lapis)}
.offbar{margin:0;background:var(--gold-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:13px}
.offnote{margin:6px 0 0;font-size:12px;color:var(--warn)}
.rm{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:14px;flex:none}
.rm:hover{background:var(--warn-soft);color:var(--warn)}
.confirm{width:100%;display:flex;flex-direction:column;gap:8px}
.confirm p{margin:0;font-size:14px}
.btn-danger{background:var(--warn);color:var(--surface)}
.back.danger{color:var(--warn)}
.invite{border-color:var(--gold);background:var(--gold-soft)}
.linkbox{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:13px;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
a.btn{text-decoration:none}
button.brand{border:0;background:none;padding:0;text-align:start;cursor:pointer}
.shead{display:flex;align-items:center;gap:12px}
.shead h2{font-size:18px;margin:0;min-width:0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .btn{padding:11px 10px;font-size:14px}
.prog .bar.gold i,.bar.gold i{background:var(--gold)}
.khatm{border-color:var(--gold);background:var(--gold-soft);text-align:center}
.khatm .big{font-family:var(--f-brand);font-size:28px;color:var(--lapis);line-height:1.4}
.khatm .q{font-family:var(--f-quran);font-size:19px;line-height:1.9;color:var(--gold);margin-top:6px}
.note.unread{font-weight:500}
.note.read{color:var(--muted)}
.dz{border-color:var(--warn-soft)}
.qada .list li{gap:10px}
.diag li{font-size:13px;padding:7px 0}
.cancel-link{margin-top:10px;font-size:13px;color:inherit;opacity:.8;text-decoration:underline}
.cancelbox{margin-top:12px;background:var(--surface);color:var(--ink);border-radius:12px;padding:12px}
.rm.mv{font-size:16px}
.confirm select{width:100%}
.diag b{font-weight:600;color:var(--ink)}
.tag{font-size:11px;font-weight:500;color:var(--lapis);background:var(--lapis-soft);border-radius:99px;padding:1px 8px;vertical-align:middle}
.selfcard label{font-size:14px;line-height:1.5}
.fsz{margin-top:8px;gap:8px;justify-content:flex-end}
.fsz button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;min-width:40px;height:32px;font-size:15px}
.fsz button[disabled]{opacity:.4}
.hdr .bell{width:36px;height:36px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<header class="top"><div class="top-in">
  <button class="brand" id="brand" type="button" aria-label="الرئيسية">ختمة<small id="gname">ختمة العائلة</small></button>
  <div class="hdr" id="hdr"></div>
  <button class="themebtn" id="theme" type="button"></button>
</div></header>

<main><div class="wrap" id="view"></div></main>

  return `<div class="card selfcard"><div class="switch"><label for="selfread"><b>أقرأ مع المجموعة</b><br><span class="sub">${on?`تُحسب قراءتك مع الأعضاء · نقاطك ${AR(pointsFor(A.mid))} · التزامك ${AR(commit(A.mid))}٪`:'فعّلها لتقرأ الورد وتظهر قراءتك مع الأعضاء'}</span></label>
    <input type="checkbox" id="selfread" ${on?'checked':''}></div></div>`}
function adminView(){
  const w=cur(), done=w?G.members.filter(m=>w.done[m.id]):[], pend=w?G.members.filter(m=>!w.done[m.id]):[];
  const pct=G.members.length?Math.round(100*done.length/G.members.length):0;
  const startRub=comp.mode==='continue'?G.nextRub:(comp.pick||1);
  const pv=makeWird(startRub,G.unit,G.hours,Date.now());
  const ayahs=pv.end-pv.start+1, pages=pv.p2-pv.p1+1;
  const rubOpts=Array.from({length:240},(_,i)=>i+1).map(r=>`<option value="${r}" ${r===startRub?'selected':''}>${rubLabel(r)} — ${ref(rubStart(r))}</option>`).join('');
  return khatmaCard()+(w?`
  <div class="card wird">
    <p class="h"><span>الورد الحالي · ${unitName(w.count)}</span><span>${ago(w.at)}</span></p>
    <div class="range">${ref(w.start)} ← ${ref(w.end)}</div>
    <div class="meta"><span>صفحات ${AR(w.p1)}–${AR(w.p2)}</span><span>${left(w)}</span>${w.bonus?`<span>⭐ مكافأة المبادرين: أول ${AR(w.bonus)} ساعات</span>`:''}</div>
    <div style="margin-top:14px" class="bar"><i style="width:${pct}%"></i></div>
    <div class="meta" style="margin-top:6px"><span class="num">${allDone(w)?'🌿 المجموعة كلها أتمّت الورد':`قرأ ${AR(done.length)} من ${AR(G.members.length)}`}</span></div>
    ${cancelOpen?`<div class="cancelbox">${confirmRow(`إلغاء الورد «${ref(w.start)} ← ${ref(w.end)}»؟ ${done.length?`أتمّه ${AR(done.length)} وستُحذف قراءاتهم له. `:''}ترجع المجموعة لنفس نقطة البداية، ويصل للأعضاء تنبيه بالإلغاء.`,'cw-ok','نعم، ألغِ الورد','cw-no','تراجع')}</div>`:''}
    <div class="row" style="margin-top:14px">${selfReads()
      ?`<button class="btn btn-light" id="read">${w.done[A.mid]?'إعادة القراءة':(readPos(w)?'أكمل القراءة':'ابدأ القراءة')}</button>`
      :'<button class="btn btn-light" id="preview">معاينة الورد في المصحف</button>'}</div>
    ${cancelOpen?'':'<button class="back cancel-link" id="cw-open">نُشر بالخطأ؟ إلغاء هذا الورد</button>'}
  </div>
  ${selfCard()}
  ${selfReads()?qadaCard({id:A.mid}):''}
  <div class="card">
    <p class="h"><span>متابعة الورد الحالي</span>
      <button class="btn btn-ghost" id="remind" style="padding:6px 12px;font-size:13px" ${pend.length?'':'disabled'}>تذكير المتأخرين (${AR(pend.length)})</button></p>
    ${G.members.length?'':`<p class="empty">لا يوجد أعضاء بعد. ادعُهم برابط المجموعة.</p>`}
    <ul class="list">${[...pend,...done].map(m=>`<li><span class="av">${initials(m.name)}</span>
      <span class="grow"><span class="name">${esc(m.name)}${m.id===A.mid?' <span class="tag">المشرف</span>':''}</span><br><span class="sub">${w.done[m.id]?'أتم '+ago(w.done[m.id]):'لم يقرأ بعد'}</span></span>
      <span class="chip ${w.done[m.id]?'ok':'wait'}">${w.done[m.id]?(bonusOf(w,w.done[m.id])?'⭐ تم':'تم ✓'):'لم يقرأ'}</span></li>`).join('')}</ul>
  </div>`:`
  <div class="card wird">
    <p class="h"><span>مرحباً بك في ${esc(G.group)}</span></p>
    <div class="range">ابدأ أول ورد للمجموعة</div>
    <div class="meta"><span>اختر المقدار من الأسفل واضغط نشر، وسيصل إشعار لكل الأعضاء.</span></div>
  </div>${selfCard()}`)+`
  <div class="actions">
    <button class="btn btn-ghost" id="to-invite">دعوة الأعضاء</button>
    <button class="btn btn-ghost" id="to-settings">⚙ إعدادات المجموعة</button>
  </div>
  <div class="card" id="composer">
    <h2>نشر ورد جديد</h2>
    <div class="field"><span class="lbl">مقدار الورد</span>
      <div class="opts">${UNITS.map(u=>`<button data-unit="${u.n}" aria-pressed="${G.unit===u.n}">${u.t}<small>${u.s}</small></button>`).join('')}</div></div>
    <div class="field"><span class="lbl">من أين يبدأ؟</span>
      <label class="radio"><input type="radio" name="mode" id="mode-c" value="continue" ${comp.mode==='continue'?'checked':''}>
        <span>إكمال من حيث توقفنا<br><span class="sub">${rubLabel(G.nextRub)} — ${ref(rubStart(G.nextRub))}</span></span></label>
      <label class="radio"><input type="radio" name="mode" id="mode-p" value="pick" ${comp.mode==='pick'?'checked':''}><span>اختيار بداية أخرى</span></label>
      ${comp.mode==='pick'?`<select id="pick" aria-label="بداية الورد">${rubOpts}</select>`:''}
    </div>
    <div class="field"><label for="hours">مدة القراءة</label>
      <select id="hours">${[12,24,48,72].map(h=>`<option value="${h}" ${G.hours===h?'selected':''}>${AR(h)} ساعة</option>`).join('')}</select></div>
    <div class="preview">
      <div class="sub">سيصل للأعضاء:</div>
      <div class="q">من ${ref(pv.start)} إلى ${ref(pv.end)}</div>
      <div class="sub"><b>${AR(pages)}</b> صفحات · <b>${AR(ayahs)}</b> آية · صفحات المصحف ${AR(pv.p1)}–${AR(pv.p2)}${pv.endRub===240?' · <b>هذا الورد يختم القرآن</b>':''}${G.bonus.enabled?` · ⭐ مكافأة لأول ${AR(G.bonus.hours)} ساعات`:''}</div>
    </div>
    <div class="row" style="margin-top:14px"><button class="btn btn-main" id="publish">نشر الورد وإشعار ${AR(G.members.length)} ${G.members.length>2&&G.members.length<11?'أعضاء':'عضو'}</button></div>
  </div>`;
}
function bindAdmin(){
  const pv=$('#preview');if(pv)pv.onclick=()=>openReader(cur());
  const co=$('#cw-open');if(co)co.onclick=()=>{cancelOpen=true;render()};
  const cn=$('#cw-no');if(cn)cn.onclick=()=>{cancelOpen=false;render()};
  const cy=$('#cw-ok');if(cy)cy.onclick=async()=>{cy.disabled=true;cy.textContent='جارٍ الإلغاء…';
    const {error}=await sb.rpc('cancel_wird',{p_wird:cur().id});cancelOpen=false;
    if(error){render();return toast(/not latest/i.test(error.message)?'يمكن إلغاء آخر ورد فقط.':errMsg(error))}
    try{localStorage.removeItem('khatma-pos-'+cur().id)}catch(e){}
    comp={mode:'continue',pick:null};await refresh();toast('أُلغي الورد. يمكنك نشر الورد الصحيح الآن.')};
  const rd=$('#read');if(rd)rd.onclick=()=>openReader(cur());
  document.querySelectorAll('[data-qada]').forEach(b=>b.onclick=()=>{const w=G.wirds.find(x=>String(x.id)===b.dataset.qada);if(w)openReader(w)});
  const sr=$('#selfread');if(sr)sr.onchange=async()=>{const on=sr.checked;sr.disabled=true;
    const {error}=on?await sb.rpc('join_group',{p_code:G.code}):await sb.rpc('leave_group',{p_group:G.id});
    if(error){sr.checked=!on;sr.disabled=false;return toast(errMsg(error))}
    await refresh();toast(on?'تمام، ستُحسب قراءتك مع المجموعة ويصلك إشعار الورد':'أُوقفت قراءتك مع المجموعة')};
  $('#to-settings').onclick=()=>go('settings');
  $('#to-invite').onclick=()=>go('settings','invite');
  document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{G.unit=+b.dataset.unit;render()});
  document.querySelectorAll('input[name=mode]').forEach(r=>r.onchange=()=>{comp.mode=r.value;if(r.value==='pick'&&!comp.pick)comp.pick=G.nextRub;render()});
  const pk=$('#pick');if(pk)pk.onchange=()=>{comp.pick=+pk.value;render()};
  $('#hours').onchange=e=>{G.hours=+e.target.value;render()};
  $('#publish').onclick=async e=>{
    const btn=e.currentTarget;btn.disabled=true;btn.textContent='جارٍ النشر…';
    const start=comp.mode==='continue'?G.nextRub:(comp.pick||1);
    const w=makeWird(start,G.unit,G.hours,Date.now());
    const {error}=await sb.rpc('publish_wird',{p_group:G.id,p_start_rub:w.startRub,p_end_rub:w.endRub,p_count:w.count,
      p_start:w.start,p_end:w.end,p_p1:w.p1,p_p2:w.p2,p_hours:G.hours,p_text:`«${G.group}»: نزل الورد الجديد: من ${ref(w.start)} إلى ${ref(w.end)}`});
    if(error){toast(errMsg(error));render();return}
    comp={mode:'continue',pick:null};await refresh();scrollTo({top:0,behavior:'smooth'});
    toast(`نُشر الورد ووصل إشعار إلى ${AR(G.members.length)} ${G.members.length>2&&G.members.length<11?'أعضاء':'عضو'}`)};
  const rb=$('#remind');if(rb)rb.onclick=async()=>{const w=cur();rb.disabled=true;
    const {data,error}=await sb.rpc('remind_pending',{p_wird:w.id,p_text:`«${G.group}»: تذكير لطيف، ورد اليوم في انتظارك (${ref(w.start)} ← ${ref(w.end)}). ${left(w)}`});
    rb.disabled=false;if(error){toast(errMsg(error));return}
    toast(`أُرسل التذكير إلى ${AR(data||0)} ${data>2&&data<11?'أعضاء':'عضو'}`)};
}

  return `<div class="card" id="bonuscard"><p class="h"><span>مكافأة المبادرين</span><span class="chip ${b.enabled?'ok':'wait'}">${b.enabled?'مفعّلة':'متوقفة'}</span></p>

    <div class="field"><label for="bn-h">المدة</label><select id="bn-h">${[3,6,12].map(h=>`<option value="${h}" ${b.hours===h?'selected':''}>أول ${AR(h)} ساعات من نزول الورد</option>`).join('')}</select></div>

    <div class="switch" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px"><label for="board">إظهار ترتيب النقاط للأعضاء</label><input type="checkbox" id="board" ${G.showBoard?'checked':''}></div>

function bindSettings(){
  $('#sback').onclick=back;
  bindAuto();
  $('#copy').onclick=()=>{const t=inviteLink(),p=navigator.clipboard&&navigator.clipboard.writeText(t);
    const sel=()=>{const r=document.createRange();r.selectNodeContents($('.linkbox'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('حدّد الرابط وانسخه يدوياً')};

  const sh=$('#share');if(sh)sh.onclick=()=>navigator.share({title:'ختمة «'+G.group+'»',text:inviteMsg()}).catch(()=>{});

  const rgn=$('#rg-no');if(rgn)rgn.onclick=()=>{regen=false;render()};
  const rgo=$('#rg-ok');if(rgo)rgo.onclick=async()=>{rgo.disabled=true;const {error}=await sb.rpc('regenerate_code',{p_group:G.id});

  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{rmId=b.dataset.rm;mvId=null;render()});
  document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{mvId=b.dataset.mv;rmId=null;render()});

  const rmo=$('#rm-ok');if(rmo)rmo.onclick=async()=>{rmo.disabled=true;const who=(G.members.find(m=>m.id===rmId)||{}).name||'العضو';

/* ---- العضو: الرئيسية ---- */
function memberView(){
  const me=G.members.find(m=>m.id===A.mid)||{id:A.mid,name:A.name};
  const w=cur(), isDone=!!(w&&w.done[me.id]);
  const board=[...G.members].sort((a,b)=>pointsFor(b.id)-pointsFor(a.id));
  const bonusLeft=w&&w.bonus&&!isDone?w.at+w.bonus*H-Date.now():0;
  return `
  <div><h2>السلام عليكم يا ${esc(me.name)}</h2></div>
  ${khatmaCard()}
  ${w?`<div class="card wird">
    <p class="h"><span>${isDone?'وردك لهذه المرة':'الورد الجديد'} · ${unitName(w.count)}</span><span>${ago(w.at)}</span></p>
    <div class="range">${ref(w.start)} ← ${ref(w.end)}</div>
    <div class="meta"><span>${AR(w.p2-w.p1+1)} صفحات</span><span>${isDone?(isQueued(w)?'أتممته · في انتظار الاتصال':'أتممته '+ago(w.done[me.id])):left(w)}</span></div>

const VAPID_PUBLIC='BKzvo8cyfSJ_xs3CHTTZa4pahxYbFIzRP-HEQTcvH8p2cj-lcmKZbi5HGiGY3DyjqKNupdpaqXhA8Q4m2Q3nsv8';

}else pushState='unsupported';
const getReg=()=>swReg?Promise.resolve(swReg):('serviceWorker' in navigator?Promise.race([navigator.serviceWorker.ready,new Promise(r=>setTimeout(()=>r(null),3000))]):Promise.resolve(null));
function b64u(s){const b=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function checkPush(){
  if(!pushOK()||!swReg){pushState='unsupported';return}
  try{
    if(Notification.permission==='denied')pushState='denied';
    else{const s=await swReg.pushManager.getSubscription();pushState=s?'on':'off';if(s&&A)savePush(s)}

  if(error)console.error(error);return !error}
async function enablePush(btn){
  if(btn){btn.disabled=true;btn.textContent='لحظة…'}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){pushState=perm==='denied'?'denied':'off';render();return toast('لم يتم السماح بالإشعارات')}
    const reg=await getReg();if(!reg)throw new Error('no service worker');
    let s=await reg.pushManager.getSubscription();
    if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
    const ok=await savePush(s);pushState='on';render();
    toast(ok?'تم تفعيل الإشعارات ✓':'فُعّلت على الجهاز لكن تعذّر حفظها. حدّث الصفحة وحاول مرة أخرى.');

}

}

  try{return {date:d.toLocaleDateString('en-CA',{timeZone:tz}),time:d.toLocaleTimeString('en-GB',{timeZone:tz,hour12:false}).slice(0,5),dow:new Date(d.toLocaleString('en-US',{timeZone:tz})).getDay()}}

  try{localStorage.setItem('khatma-cache-'+A.role,JSON.stringify({uid:A.mid,A,GROUPS,G,NOTES,at:lastLoadAt||Date.now()}))}catch(e){}}
function restoreCache(){
  const mode=getMode();let c=null;
  try{c=JSON.parse(localStorage.getItem('khatma-cache-'+(mode||'member'))||'null')}catch(e){}
  if(!c||!c.A||(A&&A.mid!==c.uid))return false;
  A=c.A;GROUPS=c.GROUPS||[];G=c.G;NOTES=c.NOTES||[];USER=USER||{id:c.uid};applyQueue();OFF=c.at||Date.now();return true;

function clearLocal(){['khatma-cache-admin','khatma-cache-member','khatma-queue'].forEach(k=>lsSet(k,null))}

// ---- تسجيل «تم» بدون إنترنت ----
const getQ=()=>{try{return JSON.parse(lsGet('khatma-queue')||'[]')}catch(e){return []}};
const setQ=q=>lsSet('khatma-queue',q.length?JSON.stringify(q):null);
const isNetErr=e=>!navigator.onLine||/fetch|network|failed to|load failed/i.test((e&&e.message)||'');
function applyQueue(){if(!G||!A)return;const q=getQ();
  G.wirds.forEach(w=>{const it=q.find(x=>x.wird_id===w.id&&x.user_id===A.mid);if(it&&!w.done[A.mid])w.done[A.mid]=Date.parse(it.done_at)})}
const isQueued=w=>getQ().some(x=>x.wird_id===w.id&&A&&x.user_id===A.mid);
async function flushQueue(){
  const q=getQ();if(!q.length||!navigator.onLine)return 0;
  const keep=[];let sent=0;
  for(const it of q){const {error}=await sb.from('completions').insert(it);
    if(!error||error.code==='23505')sent++;else if(isNetErr(error))keep.push(it);}
  setQ(keep);return sent;
}
window.addEventListener('online',async()=>{if(!A)return;const n=await flushQueue();await refresh();
  toast(n?`عاد الاتصال، وأُرسلت ${AR(n)} ${n>2?'قراءات':'قراءة'} للمشرف`:'عاد الاتصال بالإنترنت')});
window.addEventListener('offline',()=>{if(!A)return;OFF=lastLoadAt||Date.now();if(!R)render()});

function bindAuth(){
  document.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=$('#'+b.dataset.eye),show=i.type==='password';
    i.type=show?'text':'password';b.textContent=show?'إخفاء':'إظهار';b.setAttribute('aria-label',show?'إخفاء كلمة المرور':'إظهار كلمة المرور')});
  document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{AU={role:b.dataset.role,tab:'login',err:'',info:''};render()});
  const bk=$('#back');if(bk)bk.onclick=()=>{if(AU.stage==='verify'){AU={role:AU.role,tab:AU.tab,err:'',info:''}}else AU={role:null,tab:'login',err:'',info:''};render()};
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{AU.tab=b.dataset.tab;AU.err='';AU.info='';render()});
  tickResend();
  const fc=$('#f-code');if(fc&&PJ&&!fc.value)fc.value=PJ.code;
  const rf=$('#recform');if(rf)rf.onsubmit=async e=>{e.preventDefault();const np=$('#f-np').value;
    if(np.length<6){AU.err='كلمة المرور 6 أحرف على الأقل.';return render()}
    if(np!==$('#f-np2').value){AU.err='كلمتا المرور غير متطابقتين.';return render()}
    const {error}=await sb.auth.updateUser({password:np});if(error){AU.err=errMsg(error);return render()}
    recovery=false;AU.err='';history.replaceState(null,'',location.pathname);await refresh();toast('تم حفظ كلمة المرور الجديدة')};
  const fg=$('#forgot');if(fg)fg.onclick=async()=>{const email=$('#f-user').value.trim().toLowerCase();
    if(!email){AU.err='اكتب بريدك الإلكتروني أولاً، ثم اضغط «نسيت كلمة المرور».';AU.info='';return render()}
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    AU.err=error?errMsg(error):'';AU.info=error?'':'أرسلنا رابط تغيير كلمة المرور إلى بريدك.';render();$('#f-user').value=email};
  const of=$('#otpform');if(of)of.onsubmit=async e=>{e.preventDefault();if(busy)return;
    const token=$('#f-otp').value.replace(/\D/g,'');
    if(token.length<6){AU.err='اكتب الرمز كاملاً كما وصلك.';AU.info='';render();return}
    busy=true;const btn=$('#otpbtn');btn.disabled=true;btn.textContent='جارٍ التحقق…';
    let {error}=await sb.auth.verifyOtp({email:AU.email,token,type:'email'});
    if(error&&AU.kind==='signup'){const r=await sb.auth.verifyOtp({email:AU.email,token,type:'signup'});error=r.error}
    busy=false;
    if(error){AU.err=/expired|invalid|not found/i.test(error.message)?'الرمز غير صحيح أو انتهت صلاحيته. اطلب رمزاً جديداً.':errMsg(error);AU.info='';render();$('#f-otp').value=token;return}
    const kind=AU.kind;if(AU.role)setMode(AU.role);AU={role:null,tab:'login',err:'',info:''};comp={mode:'continue',pick:null};showNotes=false;
    loading=true;render();await refresh();scrollTo(0,0);
    toast(kind==='signup'?(A&&A.role==='admin'&&G?`تم تفعيل حسابك. كود المجموعة: ${G.code}`:'تم تفعيل حسابك، أهلاً بك'):`أهلاً ${A?A.name:''}`)};
  const rs=$('#resend');if(rs)rs.onclick=async()=>{if(Date.now()<(AU.cool||0))return;rs.disabled=true;
    const {error}=AU.kind==='signup'
      ?await sb.auth.resend({type:'signup',email:AU.email,options:{emailRedirectTo:location.origin+location.pathname}})
      :await sb.auth.signInWithOtp({email:AU.email,options:{shouldCreateUser:false}});
    AU.cool=Date.now()+60000;AU.err=error?errMsg(error):'';AU.info=error?'':'أرسلنا رمزاً جديداً إلى بريدك.';render()};
  const f=$('#authform');if(!f)return;
  f.onsubmit=async e=>{e.preventDefault();if(busy)return;
    const val=id=>{const el=$(id);return el?el.value.trim():''};
    const email=val('#f-user').toLowerCase(), p=$('#f-pass').value, p2=$('#f-pass2')?$('#f-pass2').value:'';
    const rem=$('#f-remember')?$('#f-remember').checked:true;lsSet('khatma-remember',rem?'1':'0');if(!rem)clearLocal();
    const keep={name:val('#f-name'),group:val('#f-group'),code:val('#f-code')};
    const fail=m=>{busy=false;AU.err=m;AU.info='';render();
      $('#f-user').value=email;$('#f-pass').value=p;if($('#f-pass2'))$('#f-pass2').value=p2;
      [['#f-name','name'],['#f-group','group'],['#f-code','code']].forEach(([s,k])=>{const el=$(s);if(el)el.value=keep[k]})};
    if(!email||!p)return fail('اكتب البريد الإلكتروني وكلمة المرور.');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))return fail('اكتب بريداً إلكترونياً صحيحاً، مثل name@example.com');
    if(AU.tab==='login'){
      busy=true;const btn=$('#authbtn');btn.disabled=true;btn.textContent='لحظة…';
      const {data,error}=await sb.auth.signInWithPassword({email,password:p});
      if(error){
        if(/not confirmed/i.test(error.message)){await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:location.origin+location.pathname}});
          return toVerify('signup',email,'حسابك غير مفعّل بعد. أرسلنا لك رمز التفعيل.')}
        return fail(errMsg(error));
      }
      if(isTrusted(email)&&remember()){
        setMode(AU.role);busy=false;AU={role:null,tab:'login',err:'',info:''};comp={mode:'continue',pick:null};showNotes=false;
        loading=true;render();await refresh();scrollTo(0,0);return toast(`أهلاً ${A?A.name:''}`);
      }
      await sb.auth.signOut({scope:'local'});
      const r=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false}});
      if(r.error)return fail(errMsg(r.error));
      setMode(AU.role);
      return toVerify('login',email);
    }
    if(!keep.name)return fail('اكتب اسمك.');
    if(p.length<6)return fail('كلمة المرور 6 أحرف على الأقل.');
    if(p!==p2)return fail('كلمتا المرور غير متطابقتين.');
    if(AU.role==='admin'&&!keep.group)return fail('اكتب اسم المجموعة.');
    busy=true;const btn=$('#authbtn');btn.disabled=true;btn.textContent='لحظة…';
    if(AU.role==='member'){
      if(!keep.code)return fail('اكتب كود المجموعة.');
      const {data,error}=await sb.rpc('check_group_code',{p_code:keep.code});
      if(error)return fail(errMsg(error));if(!data)return fail('كود المجموعة غير صحيح. تأكد منه مع المشرف.');
    }
    const {data,error}=await sb.auth.signUp({email,password:p,options:{emailRedirectTo:location.origin+location.pathname,
      data:{name:keep.name,role:AU.role,group_name:keep.group,group_code:keep.code.toUpperCase()}}});
    if(error)return fail(errMsg(error));
    if(data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0)
      return fail(`هذا البريد مسجّل بالفعل. ادخل من تبويب «دخول» بنفس كلمة المرور، وبعدها ${AU.role==='admin'?'أنشئ مجموعتك':'انضم بالكود'}.`);
    busy=false;setMode(AU.role);
    if(PJ&&keep.code.toUpperCase()===PJ.code)clearPJ();
    if(!data.session)return toVerify('signup',email);
    AU={role:null,tab:'login',err:'',info:''};loading=true;render();await refresh();scrollTo(0,0);
    toast(A&&A.role==='admin'&&G?`أُنشئت المجموعة. كود الدعوة: ${G.code}`:'أهلاً بك في المجموعة');
  };
}

/* ---------- قياس السرعة (افتح الرابط مع #diag في آخره) ---------- */
function diagCard(){if(location.hash!=='#diag')return '';
  const ms=v=>v==null?'—':`${AR(v)} ملّي ثانية`, c=navigator.connection;
  const rows=[['فتح الصفحة وتشغيلها',ms(DIAG.t0)],['أول ما ظهر المحتوى',ms(DIAG.first)],['ظهر من النسخة المحفوظة',DIAG.cached?'نعم':'لا'],
    ['التحقق من الدخول',ms(DIAG.session)],['تحميل البيانات من السيرفر',ms(DIAG.state)],['زمن الوصول للسيرفر',DIAG.ping?ms(DIAG.ping):'اضغط «قياس الاتصال»'],
    ['عامل الخدمة',navigator.serviceWorker&&navigator.serviceWorker.controller?'شغال':'غير شغال'],['التطبيق مثبّت',standalone()?'نعم':'لا'],
    ['نوع الشبكة',c&&c.effectiveType?c.effectiveType:'غير معروف'],['الإصدار',DIAG.v]];
  return `<div class="card diag"><p class="h"><span>قياس السرعة</span></p><ul class="list">${rows.map(r=>`<li><span class="grow">${r[0]}</span><b class="num">${r[1]}</b></li>`).join('')}</ul>
    <div class="row" style="margin-top:10px"><button class="btn btn-ghost sm" id="dg-ping">قياس الاتصال</button><button class="btn btn-ghost sm" id="dg-copy">نسخ النتائج</button></div></div>`}
function bindDiag(){const p=$('#dg-ping');if(!p)return;
  p.onclick=async()=>{p.disabled=true;p.textContent='جارٍ القياس…';let best=1e9;
    for(let k=0;k<3;k++){const a=performance.now();try{await fetch(SB_URL+'/auth/v1/health',{headers:{apikey:SB_KEY},cache:'no-store'})}catch(e){}best=Math.min(best,performance.now()-a)}
    DIAG.ping=Math.round(best);render()};
  $('#dg-copy').onclick=()=>{const t=[...document.querySelectorAll('.diag li')].map(li=>li.innerText.replace(/\n/g,': ')).join('\n');
    const pr=navigator.clipboard&&navigator.clipboard.writeText(t);if(pr)pr.then(()=>toast('نُسخت النتائج'),()=>toast('صوّر الشاشة بدلاً من النسخ'));else toast('صوّر الشاشة بدلاً من النسخ')}}
addEventListener('hashchange',()=>{if(location.hash==='#diag')render()});

  const bl=$('#bell');if(bl)bl.onclick=()=>{if(VIEW==='notes')back();else go('notes')};
  const lo=$('#logout');if(lo)lo.onclick=async()=>{
    if(getQ().length&&!navigator.onLine)return toast('عندك قراءات لم تُرسل بعد. اتصل بالإنترنت أولاً ثم اخرج.');
    await flushQueue();await disablePush();await sb.auth.signOut();clearLocal();A=null;G=null;USER=null;GROUPS=[];NOTES=[];gAdd=false;OFF=null;VIEW='home';AU={role:null,tab:'login',err:'',info:''};render();scrollTo(0,0)};
